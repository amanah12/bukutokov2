plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bukutoko.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bukutoko.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }

    signingConfigs {
        app {
            storeFile file('bukutoko.jks')
            storePassword 'bukutoko'
            keyAlias 'bukutoko'
            keyPassword 'bukutoko'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.app
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // hanya untuk FileProvider (bagikan gambar struk)
    implementation 'androidx.core:core:1.12.0'
}
